<head>

  <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">

  <!-- iOS: abre em tela cheia quando adicionado à Tela de Início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ficha">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- Aplica tema, cor e estilo salvos antes de desenhar a tela (evita piscar) -->
  <script>
    try {
      var L = JSON.parse(localStorage.getItem('ficha.look') || '{"theme":"auto"}'), d = document.documentElement;
      var sc = L.theme === 'light' || (L.theme === 'auto' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      var st = L.style, ua = navigator.userAgent;
      // Sem estilo salvo: o do aparelho (Android → Material You, iPhone/iPad → Liquid Glass, outros → Clássico)
      if (!st) st = /android/i.test(ua) ? 'material' : /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'glass' : 'classic';
      d.setAttribute('data-scheme', sc);
      if (L.theme === 'black') d.setAttribute('data-black', '');
      if (st === 'glass') d.setAttribute('data-glass', '');
      if (st === 'material') d.setAttribute('data-material', '');
      var v = L[sc] || {};
      for (var k in v) d.style.setProperty(k, v[k]);
    } catch (e) {}
  </script>
</head>
